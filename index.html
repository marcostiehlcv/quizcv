<style>
/* Mesmo sistema visual do Hoje CV: coluna estreita, cabeçalho azul da bandeira, superfície clara por baixo */
:root{
  --ocean:#003893; --ocean-deep:#002566; --sun:#f2c230; --rubro:#c8262f; --mar:#0b7f91;
  --ouro:#f2c230; --prata:#b9c2cf; --bronze:#cd8a52;
  --ok:#1f8a5b; --bad:#c8262f; --lv1:#1f8a5b; --lv2:#b07a00; --lv3:#c8262f;
  --bg:#f5f7fb; --surface:#ffffff; --fg:#0f1a2e; --muted:#5a6680; --line:#dde3ee; --chip:#e9eef8;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Literata",Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08111f; --surface:#0f1b30; --fg:#e8eefa; --muted:#93a1bd; --line:#1f2d47; --chip:#17253f; --ocean:#123f94; --ocean-deep:#0a2a63; --ok:#2fa872; --bad:#e0474f; --lv1:#2fa872; --lv2:#e0a400; --lv3:#e0474f; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#08111f; --surface:#0f1b30; --fg:#e8eefa; --muted:#93a1bd; --line:#1f2d47; --chip:#17253f; --ocean:#123f94; --ocean-deep:#0a2a63; --ok:#2fa872; --bad:#e0474f; --lv1:#2fa872; --lv2:#e0a400; --lv3:#e0474f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ocean-deep)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.mast{background:linear-gradient(170deg,var(--ocean) 0%,var(--ocean-deep) 100%);color:#fff}
/* bandeira de fundo no cabeçalho: grande, inclinada e cortada (só se vê parte das faixas e das estrelas), em degradê suave a partir da direita */
.flagbg{position:absolute;top:50%;right:calc(-1 * min(330px,32vw));width:max(620px,62vw);height:auto;aspect-ratio:17/10;pointer-events:none;z-index:0;opacity:.5;
  transform:translateY(-50%) rotate(-11deg);transform-origin:60% 50%;
  -webkit-mask-image:radial-gradient(ellipse 60% 75% at 62% 55%,#000 0%,rgba(0,0,0,.55) 45%,transparent 75%);mask-image:radial-gradient(ellipse 60% 75% at 62% 55%,#000 0%,rgba(0,0,0,.55) 45%,transparent 75%)}
@media (prefers-reduced-motion:no-preference){.flagbg{animation:ondula 18s ease-in-out infinite alternate}}
@keyframes ondula{from{transform:translateY(-50%) rotate(-11deg) scale(1)}to{transform:translateY(-52%) rotate(-8deg) scale(1.05)}}
header.mast>.wrap{position:relative;z-index:1}
@media (max-width:899px){.flagbg{opacity:.28;right:calc(-1 * 52vw);top:62%}}
header.mast{position:relative;overflow:hidden}
header.mast .wrap{padding-block:18px 26px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;color:inherit;text-decoration:none}
.logo b{background:var(--sun);color:var(--ocean-deep);padding:0 7px;border-radius:6px}
.brand-r{display:flex;align-items:center;gap:8px}
/* etiqueta da versão no cabeçalho (normal / crianças) */
.brand-l{display:flex;align-items:center;gap:10px;min-width:0}
.vtag{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;padding:4px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.35);color:rgba(255,255,255,.85);display:inline-flex;align-items:center;gap:5px}
.vtag svg{width:12px;height:12px}
.vtag.kids{background:var(--mar);border-color:var(--mar);color:#fff;font-weight:600}
.vtag.kids svg{color:var(--sun)}
.somb{display:grid;place-items:center;width:34px;height:34px;border-radius:999px;border:0;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}
.somb svg{width:18px;height:18px}
.somb[aria-pressed="false"]{color:rgba(255,255,255,.55)}
.lang{display:inline-flex;gap:2px;background:rgba(255,255,255,.12);padding:3px;border-radius:999px}
.lang button{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;border:0;background:transparent;color:#fff;padding:5px 9px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:#fff;color:var(--ocean-deep)}
.hero{margin-top:24px;display:grid;grid-template-columns:1fr auto;align-items:end;gap:16px}
.hero h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(30px,8.5vw,44px);line-height:1;letter-spacing:-.03em;text-wrap:balance}
.flagwrap{margin:0 0 4px;width:clamp(96px,28vw,170px);aspect-ratio:17/10;border-radius:4px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.28),0 12px 28px -10px rgba(0,0,0,.55)}
.flag-cv{display:block;width:100%;height:100%}
.sub{margin:10px 0 0;font-size:15px;line-height:1.45;color:rgba(255,255,255,.82)}
button:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
main .wrap{display:flex;flex-direction:column;gap:20px;padding-block:24px 40px}
.label{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.intro p{margin:0 0 10px}
.btn{font-family:var(--display);font-weight:500;font-size:16px;border-radius:999px;padding:12px 24px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.btn.primary{background:var(--ocean);border-color:var(--ocean);color:#fff}
.btn.primary:hover{background:var(--ocean-deep)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.best{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.lvls{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 0;padding:0;list-style:none}
.lvl{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 10px;color:#fff}
.lvl.l1{background:var(--lv1)}.lvl.l2{background:var(--lv2)}.lvl.l3{background:var(--lv3)}
/* página inicial: botão sólido e simples (amarelo do logótipo) e um cartão «Como funciona» com ícones monocromáticos */
.startbig{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em;color:var(--ocean-deep);background:var(--sun);border:0;border-radius:14px;padding:17px 24px;cursor:pointer;box-shadow:0 8px 20px -10px rgba(0,0,0,.5);transition:transform .15s,filter .15s}
.startbig:hover{filter:brightness(1.05);transform:translateY(-1px)}
.startbig:active{transform:scale(.98)}
.startbig svg{width:20px;height:20px}
.how{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.how h2{margin:0;font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.howl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.howl li{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:center;min-width:0}
.howl i{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--chip);color:var(--fg)}
.howl i svg{width:19px;height:19px}
.howl b{display:block;font-family:var(--display);font-weight:800;font-size:16px;line-height:1.2;white-space:nowrap}
.howl span{display:block;font-size:13px;color:var(--muted);line-height:1.3}
.how p{margin:0;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted);line-height:1.5}
.how p b{color:var(--fg);font-weight:600}
.best{text-align:center}
/* contador público na página inicial: quantos jogos já houve em cada versão */
.conta{margin:0;text-align:center;font-size:13px;color:var(--muted);line-height:1.5;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 14px}
.conta span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.conta b{color:var(--fg);font-weight:700;font-variant-numeric:tabular-nums}
.conta svg{width:14px;height:14px;flex:none}
/* ranking (só versão normal) */
.rkhome{margin:-8px 0 0;text-align:center;font-size:13px}
.rkh{margin:0;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em}
.rkbox{display:flex;flex-direction:column;align-items:stretch;gap:10px;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.rkbox .btn{width:100%;font-weight:700}
.rkmsg{margin:0;text-align:center;font-family:var(--display);font-weight:700;font-size:17px;color:var(--fg)}
.rkmsg.erro{font-family:inherit;font-weight:400;font-size:14px;color:var(--muted)}
.rklinks{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;font-size:13.5px}
.rktabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--chip);padding:4px;border-radius:12px}
.rktabs button{font:inherit;font-family:var(--display);font-weight:600;font-size:15px;border:0;border-radius:9px;padding:9px;background:none;color:var(--muted);cursor:pointer}
.rktabs button[aria-pressed="true"]{background:var(--ocean);color:#fff}
.rklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;min-height:60px}
.rklist li{display:grid;grid-template-columns:28px 34px 1fr auto;align-items:center;gap:8px;padding:8px 12px 8px 6px;border-radius:14px;font-size:15px;background:var(--chip);border:2px solid transparent}
.rklist li .p{font-family:var(--display);font-weight:800;font-size:15px;color:var(--muted);text-align:center}
.rklist li .p.m{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#1a1300;font-size:14px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.rklist li .p.m1{background:var(--ouro)}.rklist li .p.m2{background:var(--prata)}.rklist li .p.m3{background:var(--bronze)}
.rklist li .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;font-size:16px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.rklist li .n{min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:2px 8px;line-height:1.25}
.rklist li .n span{overflow-wrap:normal;word-break:normal}
.rklist li .tu{flex:none;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;background:var(--ocean);color:#fff;padding:2px 7px;border-radius:999px}
.rklist li .s{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums}
.rklist li.top1{border-color:var(--ouro)}
.rklist li.eu{border-color:var(--ocean);background:var(--surface);box-shadow:0 6px 16px -10px rgba(0,0,0,.5)}
.rklist li.sep{display:block;background:none;border:0;padding:0;text-align:center;color:var(--muted);line-height:.6;letter-spacing:.3em}
.rklist .vazio{display:block;text-align:center;color:var(--muted);background:none!important;border:0!important;padding:16px 8px}
#rank .sheet>*{flex:none}
.rkshr{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600}
.rkshr svg{width:17px;height:17px;flex:none}
.rkfim{margin:-2px 0 0;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.rkfim svg{width:13px;height:13px}
@media (prefers-reduced-motion:no-preference){.rklist li:not(.vazio):not(.sep){animation:rkin .45s cubic-bezier(.2,.9,.3,1.2) backwards;animation-delay:calc(var(--i,0)*45ms)}
 .rklist li.eu.novo{animation:rkin .45s cubic-bezier(.2,.9,.3,1.2) backwards,rkpulso 1.2s .5s ease-in-out 2}}
@keyframes rkin{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes rkpulso{50%{transform:scale(1.03);box-shadow:0 10px 24px -8px rgba(0,56,147,.6)}}
.rkme{margin:0;font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.rkme b{color:var(--fg)}
.rkdev{margin:0;text-align:center;font-size:12px;color:var(--muted);line-height:1.4}
.rkme .rkdev{flex-basis:100%;text-align:left}
.rkre{display:inline-flex;align-items:center;gap:5px}.rkre svg{width:13px;height:13px;flex:none}
.rknote{margin:0!important;font-size:13px}
.ini{display:flex;flex-direction:column;gap:18px}
/* seletor de versão: normal / para crianças */
.modo{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--chip);padding:4px;border-radius:14px;border:1px solid var(--line)}
.modo button{font-family:var(--display);font-weight:600;font-size:15px;border:0;background:transparent;color:var(--muted);padding:10px 8px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
.modo button svg{width:17px;height:17px;flex:none}
.modo button{transition:background .2s,color .2s,box-shadow .2s}
.modo button:active{transform:scale(.97)}
/* ativa: Normal a azul; Crianças a azul-turquesa (mar) com estrela amarela (amarelo + estrela vermelha lembrava política) */
.modo button[aria-pressed="true"]{box-shadow:0 6px 14px -6px rgba(0,0,0,.5)}
.modo button[data-m="normal"][aria-pressed="true"]{background:var(--ocean);color:#fff}
/* Crianças: sempre com a estrela amarela a cintilar, para se distinguir e convidar */
.modo button[data-m="kids"]{color:var(--fg)}
.modo button[data-m="kids"] svg{width:20px;height:20px;fill:var(--sun);stroke:var(--lv2);animation:brilha 2.4s ease-in-out infinite}
.modo button[data-m="kids"][aria-pressed="true"]{background:var(--mar);color:#fff;font-weight:800}
.modo button[data-m="kids"][aria-pressed="true"] svg{fill:var(--sun);stroke:var(--sun)}
@keyframes brilha{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.22) rotate(20deg)}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rules b{color:var(--sun)}}
:root[data-theme="dark"] .rules b{color:var(--sun)}
/* contagem antes de começar: 3, 2, 1, já! em grande */
.contagem{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:color-mix(in srgb,var(--ocean-deep) 82%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.contagem b{font-family:var(--display);font-weight:800;font-size:clamp(140px,42vw,260px);line-height:1;color:#fff;text-shadow:0 20px 50px rgba(0,0,0,.45)}
.contagem b.go{color:var(--sun);font-size:clamp(90px,26vw,170px)}
.contagem b.tic{animation:tic .9s cubic-bezier(.2,.8,.3,1) both}
@keyframes tic{0%{opacity:0;transform:scale(1.8)}25%{opacity:1;transform:scale(1)}80%{opacity:1;transform:scale(.92)}100%{opacity:0;transform:scale(.7)}}
#quit{margin-left:auto}
/* cartão do resultado da pergunta: translúcido, no centro, com a explicação e o «Seguinte» */
.resbg{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,15,35,.35);animation:resbg .3s ease-out}
.rescard{width:100%;max-width:480px;max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column;gap:16px;padding:20px;border-radius:22px;border:1px solid color-mix(in srgb,var(--fg) 14%,transparent);background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);box-shadow:0 24px 60px -20px rgba(0,0,0,.6);animation:rescard .4s cubic-bezier(.2,.9,.3,1.15)}
.rescard .fb{animation:none}
.rescard .nextbar{position:static;margin:0;padding:0;background:none;animation:none}
.rescard .nextbar .btn{width:100%;min-width:0;margin:0}
@keyframes resbg{from{opacity:0}to{opacity:1}}
@keyframes rescard{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
/* jogo */
/* «Seguinte» fica preso ao fundo do ecrã, com a largura toda, para não obrigar a descer depois da explicação */
.nextbar{position:sticky;bottom:0;z-index:5;margin:0 -16px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);animation:sobe .35s ease-out}
.nextbar .btn{width:100%;font-size:18px;font-weight:800;padding:16px 24px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 24px -10px rgba(0,0,0,.55)}
.nextbar .btn::after{content:"→";font-size:20px}
@keyframes sobe{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.prog{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dots{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin-top:8px}
.dots i{height:6px;border-radius:999px;background:var(--line)}
.dots i.ok{background:var(--ok)}.dots i.bad{background:var(--bad)}.dots i.cur{background:var(--sun)}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.tema{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--chip);color:var(--muted);border-radius:999px;padding:3px 10px}
/* temporizador: anel com os segundos em grande, a pulsar a cada segundo (mais forte e vermelho nos últimos 5) */
.timer{position:relative;width:72px;height:72px;flex:none;display:grid;place-items:center}
.timer svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:6}
.timer .tr{stroke:var(--line)}
/* cores do anel e do alerta: verde até 11 s, amarelo de 10 a 6 s, vermelho abaixo de 6 s */
.timer .tp{stroke:var(--ok);stroke-linecap:round;stroke-dasharray:201;transition:stroke-dashoffset .1s linear,stroke .3s}
.timer.mid .tp{stroke:var(--sun)}
.timer b{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.timer.beat b{animation:beat .6s ease-out}
.timer.low .tp{stroke:var(--bad)}
.timer.low b{color:var(--bad)}
.timer.low.beat{animation:ring .6s ease-out}
.timer.low.beat b{animation:beatLow .6s ease-out}
.timer.done b{opacity:.45}
@keyframes beat{0%{transform:scale(1)}25%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes beatLow{0%{transform:scale(1)}25%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes ring{0%{transform:scale(1)}25%{transform:scale(1.08)}100%{transform:scale(1)}}
/* alerta do tempo: a partir dos 10 s toda a janela pulsa a vermelho, cada vez mais forte até ao fim */

<main>
  <div class="wrap">
    <!-- início -->
    <section id="v-ini" class="ini">
      <div class="modo" id="modo" role="group"><button type="button" data-m="normal" aria-pressed="true"></button><button type="button" data-m="kids" aria-pressed="false"></button></div>
      <button type="button" class="startbig" id="start"></button>
      <p class="msg" id="iniNone" hidden></p>
      <div class="how" id="how"><h2 id="howT"></h2><ul class="howl" id="rules"></ul><p id="ptsNote"></p></div>
      <p class="best" id="best"></p>
      <p class="conta" id="conta" hidden></p>
      <p class="rkhome" id="rkHomeP" hidden><button type="button" class="aboutlink" id="rkHome"></button></p>
    </section>

    <!-- pergunta -->
    <section id="v-jogo" hidden style="display:flex;flex-direction:column;gap:16px">
      <div>
        <div class="prog"><span class="label" id="pNum"></span><span class="label" id="pPts"></span></div>
        <div class="dots" id="dots"></div>
      </div>
      <div id="qbox">
      <div class="qcard">
        <div class="qtop">
          <div style="min-width:0">
            <div class="qhead"><span><span class="lvl" id="qLv"></span> <span class="tema" id="qTema"></span></span></div>
            <h2 class="q" id="qTxt"></h2>
            <p class="pista" id="qPista"></p>
          </div>
          <div class="timer" id="timer" role="timer" aria-live="off"><svg viewBox="0 0 72 72"><circle class="tr" cx="36" cy="36" r="32"/><circle class="tp" id="tRing" cx="36" cy="36" r="32"/></svg><b id="tNum"></b></div>
        </div>
      </div>
      <div class="opts" id="opts"></div>
      </div>
      <div class="tools" id="tools">
        <button type="button" class="tool big" id="skip"></button>
        <button type="button" class="tool big" id="reveal"></button>
        <button type="button" class="tool" id="report"></button>
        <button type="button" class="tool" id="quit"></button>
      </div>

    </section>

    <!-- resultado -->
    <section id="v-fim" hidden class="fim">
      <p class="verdict" id="fTxt"></p>
      <canvas id="fCv" width="1080" height="1080" role="img"></canvas>
      <p class="best" id="fPts"></p>
      <div class="fimacts">
        <button type="button" class="btn primary" id="shrNative"></button>
        <button type="button" class="btn" id="shrSave"></button>
        <button type="button" class="btn" id="shrCopy"></button>
      </div>
      <p class="msg" id="shrMsg" hidden style="text-align:center"></p>
      <!-- ranking (só versão normal), já aberto no fim: envio só com um toque; nome gerado, sem dados pessoais -->
      <div class="rkbox" id="rkBox" hidden>
        <h3 class="rkh" id="rkH"></h3>
        <button type="button" class="btn primary" id="rkJoin"></button>
        <p class="rkmsg" id="rkMsg" hidden aria-live="polite"></p>
        <div class="rklinks" id="rkLinks"><button type="button" class="aboutlink" id="rkOther"></button></div>
        <p class="rkdev" id="rkDev"></p>
        <div class="rktabs" id="rkTabsF" role="group"><button type="button" data-p="semana" aria-pressed="true"></button><button type="button" data-p="sempre" aria-pressed="false"></button></div>
        <p class="rkfim" id="rkFimF"></p>
        <ol class="rklist" id="rkListF"></ol>
        <button type="button" class="btn rkshr" id="rkShrF" hidden></button>
      </div>
      <button type="button" class="startbig" id="again"></button>
      <button type="button" class="btn revbtn" id="revBtn" aria-expanded="false" aria-controls="rev"></button>
      <ol class="rev" id="rev" hidden></ol>
    </section>

    <div class="foot"><span id="foot"></span><button type="button" class="aboutlink" id="aboutBtn"></button><nav class="apps" id="apps"></nav></div>
  </div>
</main>

 for(let i=0;i<10;i++){o.save();o.rotate(i*Math.PI/5);o.translate(0,-150);o.beginPath();for(let k=0;k<10;k++){const q=k%2?ri:ro,a=-Math.PI/2+k*Math.PI/5;o.lineTo(q*Math.cos(a),q*Math.sin(a))}o.closePath();o.fill();o.restore()}
