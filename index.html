/* Mesmo sistema visual do Hoje CV: coluna estreita, cabeçalho azul da bandeira, superfície clara por baixo */

:root[data-theme="dark"]{--bg:#08111f; --surface:#0f1b30; --fg:#e8eefa; --muted:#93a1bd; --line:#1f2d47; --chip:#17253f; --ocean:#123f94; --ocean-deep:#0a2a63; --ok:#2fa872; --bad:#e0474f; --lv1:#2fa872; --lv2:#e0a400; --lv3:#e0474f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ocean-deep)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.mast{background:linear-gradient(170deg,var(--ocean) 0%,var(--ocean-deep) 100%);color:#fff}
/* bandeira de fundo no cabeçalho: grande, inclinada e cortada (só se vê parte das faixas e das estrelas), em degradê suave a partir da direita */
.flagbg{position:absolute;top:50%;right:calc(-1 * min(330px,32vw));width:max(620px,62vw);height:auto;aspect-ratio:17/10;pointer-events:none;z-index:0;opacity:.5;
  transform:translateY(-50%) rotate(-11deg);transform-origin:60% 50%;
  -webkit-mask-image:radial-gradient(ellipse 60% 75% at 62% 55%,#000 0%,rgba(0,0,0,.55) 45%,transparent 75%);mask-image:radial-gradient(ellipse 60% 75% at 62% 55%,#000 0%,rgba(0,0,0,.55) 45%,transparent 75%)}

.startbig{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em;color:var(--ocean-deep);background:var(--sun);border:0;border-radius:14px;padding:17px 24px;cursor:pointer;box-shadow:0 8px 20px -10px rgba(0,0,0,.5);transition:transform .15s,filter .15s}

.how h2{margin:0;font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.howl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}

.howl i svg{width:19px;height:19px}

.howl span{display:block;font-size:13px;color:var(--muted);line-height:1.3}
.how p{margin:0;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted);line-height:1.5}
.how p b{color:var(--fg);font-weight:600}
.best{text-align:center}
.ini{display:flex;flex-direction:column;gap:18px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rules b{color:var(--sun)}}
:root[data-theme="dark"] .rules b{color:var(--sun)}
/* contagem antes de começar: 3, 2, 1, já! em grande */
.contagem{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:color-mix(in srgb,var(--ocean-deep) 82%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.contagem b{font-family:var(--display);font-weight:800;font-size:clamp(140px,42vw,260px);line-height:1;color:#fff;text-shadow:0 20px 50px rgba(0,0,0,.45)}
.contagem b.go{color:var(--sun);font-size:clamp(90px,26vw,170px)}
.contagem b.tic{animation:tic .9s cubic-bezier(.2,.8,.3,1) both}
@keyframes tic{0%{opacity:0;transform:scale(1.8)}25%{opacity:1;transform:scale(1)}80%{opacity:1;transform:scale(.92)}100%{opacity:0;transform:scale(.7)}}
#quit{margin-left:auto}
/* cartão do resultado da pergunta: translúcido, no centro, com a explicação e o «Seguinte» */
.resbg{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,15,35,.35);animation:resbg .3s ease-out}
.rescard{width:100%;max-width:480px;max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column;gap:16px;padding:20px;border-radius:22px;border:1px solid color-mix(in srgb,var(--fg) 14%,transparent);background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);box-shadow:0 24px 60px -20px rgba(0,0,0,.6);animation:rescard .4s cubic-bezier(.2,.9,.3,1.15)}
.rescard .fb{animation:none}
.rescard .nextbar{position:static;margin:0;padding:0;background:none;animation:none}
.rescard .nextbar .btn{width:100%;min-width:0;margin:0}
@keyframes resbg{from{opacity:0}to{opacity:1}}
@keyframes rescard{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
/* jogo */
/* «Seguinte» fica preso ao fundo do ecrã, com a largura toda, para não obrigar a descer depois da explicação */
.nextbar{position:sticky;bottom:0;z-index:5;margin:0 -16px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);animation:sobe .35s ease-out}
.nextbar .btn{width:100%;font-size:18px;font-weight:800;padding:16px 24px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 24px -10px rgba(0,0,0,.55)}
.nextbar .btn::after{content:"→";font-size:20px}
@keyframes sobe{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.prog{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dots{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin-top:8px}
.dots i{height:6px;border-radius:999px;background:var(--line)}
.dots i.ok{background:var(--ok)}.dots i.bad{background:var(--bad)}.dots i.cur{background:var(--sun)}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.tema{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--chip);color:var(--muted);border-radius:999px;padding:3px 10px}
/* temporizador: anel com os segundos em grande, a pulsar a cada segundo (mais forte e vermelho nos últimos 5) */
.timer{position:relative;width:72px;height:72px;flex:none;display:grid;place-items:center}
.timer svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:6}
.timer .tr{stroke:var(--line)}
/* cores do anel e do alerta: verde até 11 s, amarelo de 10 a 6 s, vermelho abaixo de 6 s */
.timer .tp{stroke:var(--ok);stroke-linecap:round;stroke-dasharray:201;transition:stroke-dashoffset .1s linear,stroke .3s}
.timer.mid .tp{stroke:var(--sun)}
.timer b{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.timer.beat b{animation:beat .6s ease-out}
.timer.low .tp{stroke:var(--bad)}
.timer.low b{color:var(--bad)}
.timer.low.beat{animation:ring .6s ease-out}
.timer.low.beat b{animation:beatLow .6s ease-out}
.timer.done b{opacity:.45}
@keyframes beat{0%{transform:scale(1)}25%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes beatLow{0%{transform:scale(1)}25%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes ring{0%{transform:scale(1)}25%{transform:scale(1.08)}100%{transform:scale(1)}}
/* alerta do tempo: a partir dos 10 s toda a janela pulsa a vermelho, cada vez mais forte até ao fim */
#alerta{position:fixed;inset:0;z-index:28;pointer-events:none;opacity:0;box-shadow:inset 0 0 calc(40px + var(--k,0)*110px) calc(var(--k,0)*24px) var(--ac);background:radial-gradient(ellipse at center,transparent 62%,color-mix(in srgb,var(--ac) calc(var(--k,0)*16%),transparent))}
#alerta{--ac:var(--bad)}#alerta.mid{--ac:var(--sun)}
#alerta.on{opacity:calc(.22 + var(--k,0)*.28)}
#alerta.on.beat{animation:alerta .9s ease-out}
/* tensão visual: amarelo (10–6 s) a pergunta respira; vermelho (<6 s) o ecrã bate como um coração e a pergunta treme;
   últimos 3 s: número gigante a vermelho por trás de tudo, tremor mais forte e cores a perder saturação */
body.tens-r #alerta.on{animation:alerta .8s ease-out infinite}
body.tens-y main .wrap{animation:respira 1s ease-in-out infinite}
body.tens-r main .wrap{animation:coracao .5s ease-out infinite}
body.tens-x #qbox{animation:treme .14s linear infinite}
body.tens-x main{filter:saturate(.85)}
body.tens-r .timer{filter:drop-shadow(0 0 10px color-mix(in srgb,var(--bad) 70%,transparent))}
body.tens-x .timer b{font-size:36px}
@keyframes respira{0%,100%{transform:none}50%{transform:scale(1.004)}}
@keyframes coracao{0%{transform:scale(1)}15%{transform:scale(1.005)}30%{transform:scale(1)}45%{transform:scale(1.003)}100%{transform:scale(1)}}
@keyframes treme{0%,100%{transform:translate(0,0)}25%{transform:translate(.6px,-.6px)}50%{transform:translate(-.6px,.4px)}75%{transform:translate(.4px,.6px)}}
@keyframes treme2{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(1.6px,-1px) rotate(.15deg)}50%{transform:translate(-1.4px,1px) rotate(-.15deg)}75%{transform:translate(1px,1.4px)}}
main{position:relative;z-index:1}
.fantasma{position:fixed;inset:0;z-index:0;pointer-events:none;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:min(90vw,70vh);line-height:1;color:var(--bad);opacity:0}

@keyframes alerta{0%{opacity:calc(.4 + var(--k,0)*.25)}100%{opacity:calc(.12 + var(--k,0)*.2)}}

.tool.big .n{font-family:var(--mono);font-size:12px;background:rgba(255,255,255,.22);border-radius:999px;padding:1px 7px}
.fb{border-left:4px solid var(--ok);padding:4px 0 4px 14px;animation:fade .35s}
.fb.no{border-left-color:var(--bad)}
.fb strong{font-family:var(--display);font-size:19px;display:block}
.fb .joke{margin:2px 0 8px;font-style:italic;color:var(--fg);font-size:15.5px}
.fb p{margin:0 0 6px;color:var(--muted);font-size:15.5px}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.src{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ocean);text-decoration:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .src{color:var(--sun)}}
:root[data-theme="dark"] .src{color:var(--sun)}
/* animações de acerto e de erro */
.fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.fx i{position:absolute;width:9px;height:14px;border-radius:2px;will-change:transform,opacity}
.plus{position:fixed;z-index:31;pointer-events:none;font-family:var(--display);font-weight:800;font-size:28px;color:var(--ok);animation:up 1.1s ease-out forwards}
@keyframes up{0%{opacity:0;transform:translate(-50%,0) scale(.7)}20%{opacity:1;transform:translate(-50%,-14px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
/* fim do tempo: transição suave para a derrota (a pergunta perde a cor e encolhe um pouco, e volta) */
#qbox.perdeu{animation:perdeu 1.1s ease-in-out}
@keyframes perdeu{0%{filter:none;opacity:1;transform:none}40%{filter:grayscale(1) brightness(.75);opacity:.55;transform:scale(.97) translateY(6px)}100%{filter:none;opacity:1;transform:none}}
.velo{position:fixed;inset:0;z-index:28;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(5,15,35,.55));animation:velo 1.2s ease-in-out forwards}
@keyframes velo{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
.flash{position:fixed;inset:0;z-index:29;pointer-events:none;background:var(--bad);animation:flash .5s ease-out forwards}
@keyframes flash{from{opacity:.18}to{opacity:0}}
@media (prefers-reduced-motion:reduce){.opt.ok.pop,.opt.bad.shake,.opt.flip,.plus,.flash,.fb,.timer b,.timer,#qbox,.resbg,.rescard,.contagem b,.menos1,.tool.big .n,#alerta,.velo,.nextbar{animation:none!important}.fx{display:none}}
/* fim */
.score{font-family:var(--display);font-weight:800;font-size:clamp(64px,20vw,108px);line-height:.9;letter-spacing:-.03em;color:var(--ocean)}

:root[data-theme="dark"] .score{color:var(--sun)}
.score small{font-size:.4em;color:var(--muted);font-weight:500}
.msg{font-size:14px;color:var(--muted);margin:0}
.breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.breakdown div{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.breakdown b{display:block;font-family:var(--display);font-size:22px}
.breakdown span{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.foot{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px}
.aboutlink{font:inherit;background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.aboutlink:hover{color:var(--fg)}
.apps{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}.apps>span{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}.apps a{color:var(--muted);text-decoration:none}.apps a b{color:var(--fg);font-weight:600}.apps a:hover b{text-decoration:underline;text-underline-offset:3px}
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(5,15,35,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--fg);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet h2{margin:0;font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.01em}
.sheet .ev{font-size:14px;color:var(--muted);margin:-6px 0 0}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.sheet .acts .btn{padding:10px 18px;font-size:15px}
.sheet .send{background:var(--rubro);border-color:var(--rubro);color:#fff}
.ropts{display:flex;flex-direction:column;gap:8px}
.ropt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:15px}
.ropt:has(input:checked){border-color:var(--ocean);background:var(--chip)}
.ropt input{margin-top:2px;accent-color:var(--ocean);width:18px;height:18px;flex:none}
.about p{margin:0;line-height:1.6;font-size:15.5px}
.about h3{margin:10px 0 -6px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.about h3:first-child{margin-top:0}
.fim{display:flex;flex-direction:column;gap:14px}
.verdict{margin:0;font-family:var(--display);font-weight:800;font-size:22px;line-height:1.25;text-align:center;text-wrap:balance}
#fCv{width:100%;height:auto;border-radius:18px;display:block;box-shadow:0 18px 40px -18px rgba(0,0,0,.6)}
.fimacts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fimacts .btn{padding:11px 8px;font-size:14.5px}

<main>

        <button type="button" class="tool" id="report"></button>
        <button type="button" class="tool" id="quit"></button>
      </div>

    </section>

    <!-- resultado -->
    <section id="v-fim" hidden class="fim">
      <p class="verdict" id="fTxt"></p>
      <canvas id="fCv" width="1080" height="1080" role="img"></canvas>
      <p class="best" id="fPts"></p>
      <div class="fimacts">
        <button type="button" class="btn primary" id="shrNative"></button>
        <button type="button" class="btn" id="shrSave"></button>
        <button type="button" class="btn" id="shrCopy"></button>
      </div>
      <p class="msg" id="shrMsg" hidden style="text-align:center"></p>
      <button type="button" class="startbig" id="again"></button>

 if(!reduz()){const m=document.createElement("div");m.className="menos1";m.textContent="−1";m.style.left=(rr.left+rr.width/2)+"px";m.style.top=(rr.top-6)+"px";document.body.appendChild(m);setTimeout(()=>m.remove(),950)}
 const go=()=>{ronda[idx]=n;nova();const nb=$("skip").querySelector(".n");if(nb&&!reduz())nb.classList.add("vira")};if(reduz())go();else{$("qbox").classList.remove("in");$("qbox").classList.add("out");setTimeout(go,340)}};
$("next").onclick=()=>{if(idx+1<ronda.length){idx++;nova();scrollTo({top:0,behavior:"smooth"})}else fim()};

// animações: confetes com as cores da bandeira e «+N» no acerto; clarão e tremor no erro
const reduz=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
function festa(el,ganho){if(reduz())return;const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 const fx=document.createElement("div");fx.className="fx";document.body.appendChild(fx);
 const cores=["#003893","#f7d116","#cf2027","#ffffff","#2fa872"];
 for(let i=0;i<46;i++){const p=document.createElement("i");p.style.background=cores[i%cores.length];p.style.left=cx+"px";p.style.top=cy+"px";fx.appendChild(p);
  const a=Math.random()*Math.PI*2,v=120+Math.random()*220,dx=Math.cos(a)*v,dy=Math.sin(a)*v-160,rot=Math.random()*720-360;
  p.animate([{transform:"translate(-50%,-50%) rotate(0)",opacity:1},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy+320}px)) rotate(${rot}deg)`,opacity:0}],{duration:1100+Math.random()*500,easing:"cubic-bezier(.2,.6,.4,1)",fill:"forwards"})}
 const pl=document.createElement("div");pl.className="plus";pl.textContent="+"+ganho;pl.style.left=cx+"px";pl.style.top=(r.top-10)+"px";document.body.appendChild(pl);
 setTimeout(()=>{fx.remove();pl.remove()},1700)}
// fim do tempo: um véu escuro suave e a pergunta a perder a cor por instantes, antes de mostrar a resposta
function derrota(){if(reduz())return;const v=document.createElement("div");v.className="velo";document.body.appendChild(v);setTimeout(()=>v.remove(),1300);
 const b=$("qbox");b.classList.remove("in","perdeu");void b.offsetWidth;b.classList.add("perdeu");
 if(navigator.vibrate)try{navigator.vibrate(200)}catch(_){}}
function falha(){if(reduz())return;const f=document.createElement("div");f.className="flash";document.body.appendChild(f);setTimeout(()=>f.remove(),600);
 if(navigator.vibrate)try{navigator.vibrate(120)}catch(_){}}

// resultado
let recorde=false;
function fim(){clearInterval(tick);const b=ls.get("quizcv_best",0);recorde=pts>b;if(recorde)ls.set("quizcv_best",pts);show("fim");renderFim();scrollTo({top:0})}
const certas=()=>res.filter(x=>x==="ok").length;
function renderFim(){const t=L(),n=ronda.length,s=certas();
 $("fTxt").textContent=t.verdict(s,n);$("fPts").textContent=t.ptsTotal(pts,recorde);
 $("fCv").setAttribute("aria-label",t.shareText(s,n,pts,SITE));drawCard($("fCv"));
 $("again").innerHTML=`<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>${esc(t.again)}`;
 $("shrNative").textContent=t.native;$("shrSave").textContent=t.save;$("shrCopy").textContent=t.copy;$("shrMsg").hidden=true;
 let ok=false;try{ok=!!(navigator.canShare&&navigator.canShare({files:[new File([new Blob(["x"])],"t.png",{type:"image/png"})]}))}catch(_){}
 $("shrNative").hidden=!ok&&!navigator.share;document.querySelector(".fimacts").style.gridTemplateColumns=$("shrNative").hidden?"1fr 1fr":""}
// contagem de 3 segundos antes de cada ronda
function contagem(){audio();const cd=$("cd"),n=$("cdN"),seq=["3","2","1",L().go];let i=0;cd.hidden=false;
 const passo=()=>{if(i>=seq.length){cd.hidden=true;start();return}n.textContent=seq[i];n.className="";void n.offsetWidth;n.className=(i===3?"go ":"")+"tic";if(i<3)bip(440,.18,.12,"triangle");else{bip(880,.35,.13,"triangle");bip(1320,.3,.06,"sine")}i++;setTimeout(passo,reduz()?450:900)};
 n.className="";passo()}
$("start").onclick=contagem;$("again").onclick=contagem;
// confirmação (janela própria; o temporizador pára enquanto está aberta)
function confirma(tit,txt,sim){return new Promise(res=>{const t=L();pausar();$("confTitle").textContent=tit;$("confTxt").textContent=txt;$("confYes").textContent=sim;$("confNo").textContent=t.keep;$("conf").hidden=false;$("confYes").focus();
 const fecha=v=>{$("conf").hidden=true;$("confYes").onclick=$("confNo").onclick=null;$("conf").onclick=null;if(vista==="jogo")retomar();res(v)};
 $("confYes").onclick=()=>fecha(true);$("confNo").onclick=()=>fecha(false);$("conf").onclick=ev=>{if(ev.target.id==="conf")fecha(false)}})}
$("quit").onclick=async()=>{const t=L();if(await confirma(t.quitQ,t.quitTxt,t.quitYes))fim()};

// cartão de partilha (1080×1080)
// Bandeira de fundo do cartão: grande, inclinada e cortada, em degradê a partir do canto superior direito (como no cabeçalho)
function drawFlagBg(ctx,W,H,cy){const oc=document.createElement("canvas");oc.width=W;oc.height=H;const o=oc.getContext("2d");
 const fw=W*1.25,fh=fw*600/1020;o.save();o.translate(W*1.02,H*cy);o.rotate(-11*Math.PI/180);o.translate(-fw*.6,-fh*.5);o.scale(fw/1020,fh/600);
 o.fillStyle="#003893";o.fillRect(0,0,1020,600);o.fillStyle="#fff";o.fillRect(0,300,1020,150);o.fillStyle="#cf2027";o.fillRect(0,350,1020,50);
 o.translate(382.5,375);o.fillStyle="#f7d116";const ro=35,ri=ro*Math.sin(Math.PI/10)/Math.sin(3*Math.PI/10);
 for(let i=0;i<10;i++){o.save();o.rotate(i*Math.PI/5);o.translate(0,-150);o.beginPath();for(let k=0;k<10;k++){const q=k%2?ri:ro,a=-Math.PI/2+k*Math.PI/5;o.lineTo(q*Math.cos(a),q*Math.sin(a))}o.closePath();o.fill();o.restore()}
 o.restore();o.globalCompositeOperation="destination-in";
 const g=o.createRadialGradient(W*.95,H*cy,0,W*.95,H*cy,W*.62);g.addColorStop(0,"rgba(0,0,0,1)");g.addColorStop(.45,"rgba(0,0,0,.55)");g.addColorStop(1,"rgba(0,0,0,0)");
 o.fillStyle=g;o.fillRect(0,0,W,H);ctx.save();ctx.globalAlpha=.45;ctx.drawImage(oc,0,0);ctx.restore()}
function drawFlag(ctx,x,y,w){const h=w*600/1020,s=w/1020,r=Math.max(5,w*.02);
 ctx.save();ctx.shadowColor="rgba(0,0,0,.5)";ctx.shadowBlur=w*.14;ctx.shadowOffsetY=w*.06;ctx.fillStyle="#003893";ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();ctx.restore();
 ctx.save();ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.clip();ctx.translate(x,y);ctx.scale(s,s);
 ctx.fillStyle="#003893";ctx.fillRect(0,0,1020,600);ctx.fillStyle="#fff";ctx.fillRect(0,300,1020,150);ctx.fillStyle="#cf2027";ctx.fillRect(0,350,1020,50);
 ctx.translate(382.5,375);ctx.fillStyle="#f7d116";const ro=35,ri=ro*Math.sin(Math.PI/10)/Math.sin(3*Math.PI/10);
 for(let i=0;i<10;i++){ctx.save();ctx.rotate(i*Math.PI/5);ctx.translate(0,-150);ctx.beginPath();for(let k=0;k<10;k++){const q=k%2?ri:ro,a=-Math.PI/2+k*Math.PI/5;ctx.lineTo(q*Math.cos(a),q*Math.sin(a))}ctx.closePath();ctx.fill();ctx.restore()}
 ctx.restore();
 ctx.save();ctx.strokeStyle="rgba(255,255,255,.28)";ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.stroke();ctx.restore()}
async function drawCard(cv){try{await Promise.all(['800 80px "Bricolage Grotesque"','500 28px "JetBrains Mono"'].map(f=>document.fonts.load(f)))}catch(_){}
 const W=1080,H=1080,ctx=cv.getContext("2d"),t=L(),P=88,n=ronda.length,s=certas();
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#003893");g.addColorStop(1,"#002566");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);drawFlagBg(ctx,W,H,.1);
 let y=84;ctx.textBaseline="alphabetic";ctx.font='800 56px "Bricolage Grotesque", system-ui, sans-serif';ctx.fillStyle="#fff";ctx.fillText("Quiz",P,y+48);const hw=ctx.measureText("Quiz ").width;
 ctx.fillStyle="#f7d116";const cvw=ctx.measureText("CV").width+28;ctx.beginPath();ctx.roundRect(P+hw,y-2,cvw,64,12);ctx.fill();ctx.fillStyle="#002566";ctx.fillText("CV",P+hw+14,y+48);
 
 y=330;ctx.font='500 30px "JetBrains Mono", ui-monospace, monospace';ctx.fillStyle="rgba(255,255,255,.78)";ctx.fillText(t.card.lbl,P,y);
 y+=230;ctx.font='800 250px "Bricolage Grotesque", system-ui, sans-serif';ctx.fillStyle="#f7d116";ctx.fillText(String(s),P-8,y);const sw=ctx.measureText(String(s)).width;
 ctx.font='500 90px "Bricolage Grotesque", system-ui, sans-serif';ctx.fillStyle="#fff";ctx.fillText(`/ ${n} ${t.card.of}`,P+sw+20,y);
 y+=90;ctx.font='500 34px "JetBrains Mono", ui-monospace, monospace';ctx.fillStyle="#fff";ctx.fillText(t.card.pts(pts),P,y);
 // um quadrado por pergunta
 y+=70;const sq=44,gap=12;res.forEach((r,i)=>{ctx.fillStyle=r==="ok"?"#2fa872":r==="rev"?"rgba(255,255,255,.35)":"#e0474f";ctx.beginPath();ctx.roundRect(P+i*(sq+gap),y,sq,sq,8);ctx.fill()});
 y+=sq+40;ctx.font='500 26px "JetBrains Mono", ui-monospace, monospace';let x=P;
 for(const k of [1,2,3]){const ii=ronda.map((e,i)=>e.nv===k?i:-1).filter(i=>i>=0),lab=`${t.lv[k].toUpperCase()} ${ii.filter(i=>res[i]==="ok").length}/${ii.length}`,tw=ctx.measureText(lab).width+40;
  ctx.fillStyle="rgba(255,255,255,.12)";ctx.beginPath();ctx.roundRect(x,y,tw,52,26);ctx.fill();ctx.fillStyle="#fff";ctx.fillText(lab,x+20,y+35);x+=tw+14}
 const fb=H-150;ctx.fillStyle="#fff";ctx.fillRect(0,fb,W,36);ctx.fillStyle="#cf2027";ctx.fillRect(0,fb+12,W,12);
 ctx.font='500 23px "JetBrains Mono", ui-monospace, monospace';ctx.fillStyle="rgba(255,255,255,.62)";ctx.fillText(t.card.foot,P,fb+88);
 ctx.font='500 28px "JetBrains Mono", ui-monospace, monospace';ctx.fillStyle="rgba(255,255,255,.95)";ctx.textAlign="right";ctx.fillText(SITE,W-P,fb+88);ctx.textAlign="left"}
const shareText=()=>L().shareText(certas(),ronda.length,pts,SITE);
const cardBlob=()=>new Promise(r=>$("fCv").toBlob(r,"image/png"));
const shrMsg=m=>{$("shrMsg").textContent=m;$("shrMsg").hidden=false};
$("shrNative").onclick=async()=>{try{const blob=await cardBlob();const f=new File([blob],"quizcv.png",{type:"image/png"});
 if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],text:shareText()});else await navigator.share({text:shareText()})}catch(err){if(err&&err.name!=="AbortError")shrMsg(L().nativeFail)}};
$("shrSave").onclick=async()=>{const blob=await cardBlob();const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="quizcv-resultado.png";document.body.appendChild(a);a.click();a.remove();shrMsg(L().saved)};
$("shrCopy").onclick=async()=>{try{await navigator.clipboard.writeText(shareText());shrMsg(L().copied)}catch(_){shrMsg(shareText())}};

// reportes: motivos fixos, sem texto livre; POST {id, motivos} para o Apps Script (config.js)
$("report").onclick=()=>{const t=L(),e=ronda[idx];pausar();
 $("repQ").textContent=Q(e);$("repMsg").hidden=true;$("repSend").disabled=true;$("repSend").hidden=false;
 $("repOpts").innerHTML=Object.entries(t.repMot).map(([k,v])=>`<label class="ropt"><input type="checkbox" value="${k}"><span>${esc(v)}</span></label>`).join("");
 $("rep").hidden=false};
$("repOpts").addEventListener("change",()=>{$("repSend").disabled=!$("repOpts").querySelector("input:checked")});
const fechaRep=()=>{$("rep").hidden=true;if(vista==="jogo")retomar()};
$("repCancel").onclick=fechaRep;
$("repSend").onclick=async()=>{const t=L(),e=ronda[idx],motivos=[...$("repOpts").querySelectorAll("input:checked")].map(i=>i.value);
 $("repSend").disabled=true;let m=t.repOff;
 if(API){try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({id:e.id,motivos,lang:LANG})});const j=await r.json();m=j&&j.ok?t.repOk:t.repFail}catch(_){m=t.repFail}}
 if(m!==t.repFail){const s=ls.get("quizcv_rep",[]);s.push(e.id);ls.set("quizcv_rep",s)}
 $("repMsg").textContent=m;$("repMsg").hidden=false;$("repSend").hidden=true;$("repCancel").textContent=t.close;renderQ()};

function applyLang(){const t=L();document.documentElement.lang=LANG;
 $("hTitle").textContent=t.title;$("hSub").textContent=t.sub;$("foot").textContent=t.foot;$("aboutBtn").textContent=t.aboutBtn;{const a=$("apps");if(a)a.innerHTML=`<span>${esc(t.maisApps)}</span>`+APPS.filter(x=>x[0]!==ESTA_APP).map(([k,n,u])=>`<a href="${u}?lang=${LANG}" target="_blank" rel="noopener"><b>${esc(n)}</b> · ${esc(t.appsDesc[k])} <span aria-hidden="true">↗</span></a>`).join("")}
 $("aboutTitle").textContent=t.aboutTitle;$("aboutClose").textContent=t.close;
 $("aboutTxt").innerHTML=t.about.map(([h,p])=>(h?`<h3>${esc(h)}</h3>`:"")+`<p>${esc(p)}</p>`).join("");
 $("repTitle").textContent=t.repTitle;$("repLbl").textContent=t.repLbl;$("repCancel").textContent=t.cancel;$("repSend").textContent=t.send;
 document.querySelectorAll("#lang button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.l===LANG)));
 desenhaSom();renderIni();if(vista==="jogo")renderQ();if(vista==="fim")renderFim()}
$("lang").addEventListener("click",ev=>{const b=ev.target.closest("button[data-l]");if(!b||b.dataset.l===LANG)return;LANG=b.dataset.l;ls.set("quizcv_lang",LANG);applyLang()});
$("aboutBtn").onclick=()=>{$("about").hidden=false;$("aboutClose").focus()};
$("aboutClose").onclick=()=>{$("about").hidden=true};
for(const id of ["about"])$(id).addEventListener("click",ev=>{if(ev.target.id===id)$(id).hidden=true});
$("rep").addEventListener("click",ev=>{if(ev.target.id==="rep")fechaRep()});
addEventListener("keydown",ev=>{if(ev.key!=="Escape")return;if(!$("conf").hidden){$("confNo").click();return}$("about").hidden=true;if(!$("rep").hidden)fechaRep()});
applyLang();show("ini");
